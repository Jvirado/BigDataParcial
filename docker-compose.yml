version: '3.8'

services:

  mongodb:
    image: mongo:7.0
    container_name: geo_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - geo-net

  spark-master:
    image: bitnami/spark:3.5
    container_name: geo_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - geo-net

  spark-worker:
    image: bitnami/spark:3.5
    container_name: geo_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    networks:
      - geo-net

  dask-scheduler:
    image: daskdev/dask:latest
    container_name: geo_dask_scheduler
    command: dask-scheduler
    ports:
      - "8786:8786"
      - "8787:8787"
    networks:
      - geo-net

  dask-worker-1:
    image: daskdev/dask:latest
    container_name: geo_dask_worker_1
    command: dask-worker dask-scheduler:8786
    depends_on:
      - dask-scheduler
    networks:
      - geo-net

  dask-worker-2:
    image: daskdev/dask:latest
    container_name: geo_dask_worker_2
    command: dask-worker dask-scheduler:8786
    depends_on:
      - dask-scheduler
    networks:
      - geo-net

  api:
    build: .
    container_name: geo_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/geo_accidents
      - FLASK_ENV=production
    depends_on:
      - mongodb
    networks:
      - geo-net

  jenkins:
    image: jenkins/jenkins:lts
    container_name: geo_jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - geo-net

volumes:
  mongo_data:
  jenkins_home:

networks:
  geo-net:
    driver: bridge